name: Bauen

# Bei jedem Push prüfen. Bei einem Tag v1.2.3 zusätzlich die App bauen
# und ans Release hängen.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # nötig, um das ZIP ans Release zu hängen

jobs:
  bauen:
    # macos-14 und neuer sind Apple Silicon - genau die Bauart, die
    # gebraucht wird. Ein Intel-Build waere ein zweiter Lauf auf macos-13.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python mit brauchbarem Tk
        # Das Python der Runner bringt nicht zuverlaessig ein Tk mit, das
        # mehr als ein weisses Fenster zeichnet. Homebrew tut es.
        run: |
          brew install python@3.13 python-tk@3.13
          echo "PY=/opt/homebrew/opt/python@3.13/bin/python3.13" >> "$GITHUB_ENV"

      - name: Baustube
        run: |
          "$PY" -m venv .venv-bau
          .venv-bau/bin/python -m pip install --quiet --upgrade pip py2app
          .venv-bau/bin/python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Prüfen
        # Die Proben bauen echte Fenster. Die Runner haben eine
        # Fenstersitzung - faellt das je aus, bricht es hier auf, nicht
        # erst beim Anwender.
        run: .venv-bau/bin/python pruefung.py

      - name: Bündeln und unterschreiben
        # bauen.sh nimmt das gleichbleibende Zertifikat, wenn es im
        # Schluesselbund liegt. Der Runner hat den privaten Schluessel
        # nicht, also unterschreibt er ad hoc - und die so gebaute App
        # verliert bei jedem Update die Freigabe fuer die Bildschirm-
        # aufnahme. Wer sie behalten will, baut oertlich (siehe README).
        run: PYTHON=.venv-bau/bin/python sh bauen.sh

      - name: Beweisen, dass das Bündel laeuft
        # pruefe_buendel.py sieht erst nach, ob die Skript-Bibliothek von
        # Tcl im Buendel liegt (ein Startversuch kann das *nicht* zeigen -
        # Tcl faellt auf den Homebrew-Pfad des Runners zurueck), und liest
        # danach die Ausgabe des echten Starters. "Prozess lebt noch" allein
        # ist wertlos: py2app haelt den Prozess auch bei einem Startfehler
        # am Leben und zeigt nur einen Dialog.
        run: .venv-bau/bin/python pruefe_buendel.py "dist/Brickfolio Live-Scanner.app"

      - name: Nichts zeigt auf die Baumaschine
        # Der Runner hat Homebrew unter /opt/homebrew. Zeigt eine
        # eingebundene Bibliothek noch dorthin, laeuft die App hier - und
        # bei jedem, der Homebrew anders oder gar nicht hat, nicht.
        run: |
          APP="dist/Brickfolio Live-Scanner.app"
          FREMD=$(find "$APP" -type f -perm -111 -print0 \
            | xargs -0 -n1 otool -L 2>/dev/null \
            | grep -E "^\s+/(opt|usr/local)/" | sort -u || true)
          if [ -n "$FREMD" ]; then
            echo "$FREMD"
            echo "::error::Das Buendel haengt noch an Homebrew der Baumaschine."
            exit 1
          fi
          echo "Keine Bindung an /opt oder /usr/local."

      - name: Einpacken
        # ditto statt zip: nur ditto erhaelt Symlinks und Rechte im
        # Buendel. Ein normales zip macht die App unstartbar.
        run: |
          cd dist
          ditto -c -k --keepParent --sequesterRsrc \
            "Brickfolio Live-Scanner.app" "Brickfolio-Live-Scanner-macOS-arm64.zip"
          ls -lh *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Brickfolio-Live-Scanner-macOS-arm64
          path: dist/Brickfolio-Live-Scanner-macOS-arm64.zip

      # **Hier wird bewusst nichts ans Release gehaengt.**
      #
      # Der Runner hat den privaten Schluessel nicht und unterschreibt ad
      # hoc. Ein so gebautes Paket ist fuer jede bestehende Installation
      # ein *fremdes*: Die Selbsterneuerung lehnt es ab, und eingespielt
      # haette es die Freigabe fuer die Bildschirmaufnahme gekostet - also
      # genau das, wogegen das Zertifikat ueberhaupt da ist.
      #
      # Den Schluessel hierher zu legen wuerde zwei Dinge zusammenfallen
      # lassen, die getrennt gehoeren: wer das Repo beherrscht, und wer
      # unterschreiben kann. Das macOS-Paket kommt deshalb von Svens Mac,
      # per `sh release.sh`.
      #
      # Der Bau hier bleibt trotzdem: Er beweist bei jedem Push, dass das
      # Buendel baut, nicht an Homebrew haengt und startet. Als Artefakt
      # ist es abholbar, nur eben nicht als Auslieferung.
      #
      # Solange release.sh nicht gelaufen ist, haengt am Release kein
      # macOS-Paket - `paket_waehlen()` liefert dann "", und der Scanner
      # bietet nur die Seite an, statt eine Aktualisierung zu versprechen,
      # die er nicht halten kann.

  windows:
    # Fuer Windows-Rechner. Gebaut wird mit PyInstaller, weil py2app nur macOS
    # kann. Unterschrieben wird hier **nicht**: Ein Windows-Zertifikat gibt
    # es nicht, SmartScreen warnt darum beim ersten Start - einmal
    # »Weitere Informationen« → »Trotzdem ausführen«.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baustube
        # Pillow ersetzt, was auf dem Mac `sips` und `screencapture` tun.
        run: python -m pip install --quiet pillow pyinstaller

      - name: Prüfen
        # Dieselben Proben wie auf dem Mac. Mit Pillow zur Hand laufen
        # zusaetzlich die des Windows-Wegs mit.
        #
        # Die Windows-Konsole spricht von Haus aus cp1252 und bricht am
        # ersten Haken (✓) der Ausgabe ab - mit UnicodeEncodeError, was
        # aussieht wie ein Fehler im Programm und keiner ist.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python pruefung.py

      - name: Bildschirmfoto
        # Die Knöpfe zeichnet der Scanner selbst – wie sie unter Windows
        # aussehen (Schrift, Ecken, Skalierung), sieht man nur hier. Das Bild
        # liegt danach als Artefakt am Lauf.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python ansicht.py ansicht-windows.png

      - uses: actions/upload-artifact@v4
        with:
          name: Ansicht-Windows
          path: ansicht-windows*.png

      - name: cloudflared holen
        # Kommt mit ins Paket, damit niemand etwas nachinstallieren muss,
        # um sich hinter Cloudflare Access anzumelden. Apache-2.0, die
        # Lizenz liegt als THIRD-PARTY.md dabei. Direkt von Cloudflare.
        run: >
          Invoke-WebRequest -UseBasicParsing
          -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          -OutFile "cloudflared.exe"

      - name: Bündeln
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name "Brickfolio Live-Scanner"
          --icon livescan.ico
          --add-data "README.md;."
          --add-data "THIRD-PARTY.md;."
          --add-binary "cloudflared.exe;."
          livescan.py

      - name: Beweisen, dass es startet
        run: python pruefe_windows.py

      - name: Einpacken
        run: >
          Compress-Archive -Path "dist/Brickfolio Live-Scanner/*"
          -DestinationPath "Brickfolio-Live-Scanner-Windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Brickfolio-Live-Scanner-Windows-x64
          path: Brickfolio-Live-Scanner-Windows-x64.zip

      # **Unter beiden Namen, und das ist kein Luxus.** Fassungen bis
      # 1.11.0 fragen zuerst nach dem Nupplo-Namen und halten dabei eine
      # Weiterleitung fälschlich für „Paket ist da" – nach der
      # Umbenennung des Ordners antwortet GitHub nämlich auch auf ein
      # FEHLENDES Paket mit 301. Hängt der zweite Name nicht dran, laden
      # sie anschließend eine 404. Auf dem Mac erledigt das release.sh.
      - name: Zweiter Name
        run: >
          Copy-Item "Brickfolio-Live-Scanner-Windows-x64.zip"
          "Nupplo-Live-Scanner-Windows-x64.zip"

      - name: Ans Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Brickfolio-Live-Scanner-Windows-x64.zip
            Nupplo-Live-Scanner-Windows-x64.zip
